<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">RustChain Proof-of-Antiquity — 60-second explainer</title>
  <desc id="desc">A concise original diagram explaining installation, the six-check hardware fingerprint, anti-emulation, one CPU one vote, and antiquity weighting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="1" stop-color="#111b24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 z" fill="#67e8c9"/>
    </marker>
    <style>
      .title{font:700 58px Inter,Arial,sans-serif;fill:#f7fafc;letter-spacing:-1px}
      .sub{font:400 25px Inter,Arial,sans-serif;fill:#b9c7d3}
      .step{font:700 21px Inter,Arial,sans-serif;fill:#67e8c9;letter-spacing:1.6px}
      .head{font:700 31px Inter,Arial,sans-serif;fill:#f7fafc}
      .body{font:400 23px Inter,Arial,sans-serif;fill:#cbd6df}
      .small{font:400 20px Inter,Arial,sans-serif;fill:#9fb1bf}
      .code{font:700 25px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#071019}
      .card{fill:#111e28;stroke:#29404e;stroke-width:2}
      .accent{fill:#67e8c9}
      .muted{fill:#0b151d;stroke:#29404e;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="1000" rx="0" fill="url(#bg)"/>

  <g transform="translate(90,75)">
    <text class="title" x="0" y="0" dominant-baseline="hanging">Proof-of-Antiquity, in 60 seconds</text>
    <text class="sub" x="0" y="82">RustChain rewards real vintage hardware — not a fleet of disposable virtual machines.</text>
  </g>

  <path d="M270 355 H480 M690 355 H900 M1110 355 H1320" stroke="#67e8c9" stroke-width="5" fill="none" marker-end="url(#arrow)" opacity="0.9"/>

  <g filter="url(#shadow)">
    <rect class="card" x="90" y="240" rx="28" width="360" height="300"/>
    <circle class="accent" cx="145" cy="298" r="28"/>
    <text x="145" y="298" text-anchor="middle" dominant-baseline="central" style="font:700 24px Inter,Arial,sans-serif;fill:#071019">1</text>
    <text class="step" x="190" y="286">START</text>
    <text class="head" x="125" y="360">Install the miner</text>
    <rect x="125" y="400" rx="14" width="290" height="58" fill="#67e8c9"/>
    <text class="code" x="270" y="430" text-anchor="middle" dominant-baseline="central">pip install clawrtc</text>
    <text class="small" x="125" y="500">The miner inspects the machine it is</text>
    <text class="small" x="125" y="528">actually running on.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="500" y="240" rx="28" width="360" height="300"/>
    <circle class="accent" cx="555" cy="298" r="28"/>
    <text x="555" y="298" text-anchor="middle" dominant-baseline="central" style="font:700 24px Inter,Arial,sans-serif;fill:#071019">2</text>
    <text class="step" x="600" y="286">VERIFY</text>
    <text class="head" x="535" y="360">6-check fingerprint</text>
    <text class="body" x="535" y="412">RustChain uses a six-check</text>
    <text class="body" x="535" y="445">hardware fingerprint to build</text>
    <text class="body" x="535" y="478">evidence about the CPU and its</text>
    <text class="body" x="535" y="511">execution environment.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="910" y="240" rx="28" width="360" height="300"/>
    <circle class="accent" cx="965" cy="298" r="28"/>
    <text x="965" y="298" text-anchor="middle" dominant-baseline="central" style="font:700 24px Inter,Arial,sans-serif;fill:#071019">3</text>
    <text class="step" x="1010" y="286">ANTI-EMULATION</text>
    <text class="head" x="945" y="360">Real hardware wins</text>
    <text class="body" x="945" y="412">The fingerprint helps distinguish</text>
    <text class="body" x="945" y="445">physical vintage hardware from</text>
    <text class="body" x="945" y="478">virtualized or emulated machines.</text>
    <text class="small" x="945" y="522">VMs earn ~nothing.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="muted" x="90" y="620" rx="30" width="650" height="260"/>
    <text class="step" x="130" y="665">CONSENSUS</text>
    <text class="head" x="130" y="715">1 CPU = 1 vote</text>
    <text class="body" x="130" y="765">Each physical CPU contributes a vote.</text>
    <text class="body" x="130" y="808">The vote is then weighted by hardware antiquity.</text>
    <g transform="translate(545,690)">
      <circle cx="0" cy="0" r="48" fill="#67e8c9"/>
      <circle cx="115" cy="0" r="48" fill="#1d3440" stroke="#67e8c9" stroke-width="3"/>
      <path d="M50 0 H63" stroke="#67e8c9" stroke-width="5" marker-end="url(#arrow)"/>
      <text x="0" y="4" text-anchor="middle" dominant-baseline="central" style="font:700 20px Inter,Arial,sans-serif;fill:#071019">CPU</text>
      <text x="115" y="4" text-anchor="middle" dominant-baseline="central" style="font:700 19px Inter,Arial,sans-serif;fill:#f7fafc">VOTE</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect class="muted" x="780" y="620" rx="30" width="730" height="260"/>
    <text class="step" x="820" y="665">WEIGHTING</text>
    <text class="head" x="820" y="715">Older genuine hardware → more weight</text>
    <text class="body" x="820" y="765">Proof-of-Antiquity turns age into consensus weight,</text>
    <text class="body" x="820" y="808">so vintage machines matter instead of being obsolete.</text>
    <rect x="820" y="842" rx="9" width="570" height="10" fill="#1d3440"/>
    <rect x="820" y="842" rx="9" width="455" height="10" fill="#67e8c9"/>
  </g>

  <text class="small" x="800" y="945" text-anchor="middle">Original explainer prepared for RustChain bounty #13954 • AI-assisted, source-constrained, no invented fingerprint internals</text>
</svg>
